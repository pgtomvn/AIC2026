version: "3.9"

services:
  # ── Vector Database ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aic2026-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./docker_data/qdrant/storage:/qdrant/storage
      - ./docker_data/qdrant/snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Full-Text Search ──
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: aic2026-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - ./docker_data/meilisearch/data:/meili_data
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-aic2026_dev_key}
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
