[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026-video-retrieval"
version = "0.1.0"
description = "Multimodal video search and retrieval scaffold for AIC 2026"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=2.16,<3",
  "loguru>=0.7.3,<0.8",
  "meilisearch>=0.31,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "qdrant-client>=1.12,<2",
  "requests>=2.32,<3",
  "streamlit>=1.60,<2",
  "tqdm>=4.66,<5",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
competition = [
  "av>=14,<17",
  "ctranslate2>=4.8,<5",
  "einops>=0.8,<1",
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.30,<1",
  "onnxruntime>=1.28,<2",
  "open-clip-torch>=2.32,<4",
  "paddleocr>=3,<4",
  # Paddle 3.3.x regresses CPU oneDNN/PIR inference used by PaddleOCR 3.7.
  "paddlepaddle==3.2.2",
  "rapidocr==3.9.2",
  "sacremoses>=0.1,<1",
  "sentencepiece>=0.2,<1",
  "torch==2.5.1",
  "torchvision==0.20.1",
  # Florence-2's pinned remote model code is incompatible with the
  # DynamicCache generation change in newer Transformers releases.
  "transformers>=4.51,<4.52",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires local services, external data, models, or hardware",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".research", ".test-runs", "data", "docker_data", "models", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F401", "F821", "F822", "F823", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["F401"]
