# AIC 2026 Textual KIS, Visual Q&A, and TRAKE defaults. Paths are project-relative and generated
# state remains outside Git.  The laptop profile is the guaranteed baseline.

profile: laptop

runtime:
  default_batch_id: aic25-b1-reference

warmup:
  enabled: true
  include_raw_refiner: true
  warm_query: một người đang đi bộ trong thành phố
  startup_budget_seconds: 90
  retry_after_seconds: 2

readiness:
  cache_seconds: 10
  accelerated_min_usable_vram_gib: 11.5
  default_batch_kind: native
  batches:
    aic25-b1-reference:
      kind: reference
      # Organizer maps/vectors retain every JPEG ordinal.  Adjacent ordinals
      # share a submitted source frame in 614 cases, so canonical media uses
      # the distinct source-frame identity count instead of the row count.
      expected_mapping_rows: 177321
      expected_canonical_frames: 176707
      canonical_image_min_coverage: 0.99
      expected_videos: 873
      workflows:
        kis: [organizer_clip, metadata]
        qa: [organizer_clip, metadata, canonical_images]
        trake: [organizer_clip]
      channels:
        organizer_clip: required
        metadata: required
        canonical_images: required
        ollama_vlm: required
        gemini_vlm: optional
        visual: optional
        semantic_text: optional
        ocr: optional
        asr: optional
        accelerated_visual: optional
  native_defaults:
    workflows:
      kis: [visual]
      qa: [visual, canonical_images]
      trake: [visual]
    channels:
      visual: required
      canonical_images: required
      ollama_vlm: required
      gemini_vlm: optional
      metadata: optional
      semantic_text: optional
      ocr: optional
      asr: optional
      organizer_clip: not_applicable
      accelerated_visual: optional

tools:
  ffmpeg:
    # Created by scripts/install_ffmpeg.py from a user-supplied, checksum-pinned ZIP.
    manifest: .tools/ffmpeg/active.json

data:
  root: data
  archives: data/archives
  raw_videos: data/raw/videos
  raw_keyframes: data/keyframes/native
  embeddings: data/embeddings
  metadata: data/metadata
  ocr: data/ocr
  asr: data/asr
  scratch: data/cache/scratch
  refined_frames: data/cache/refined-frames
  trake_trajectory_cache: data/cache/trake-trajectories
  catalog_db: data/state/jobs.sqlite3
  artifact_db: data/state/artifacts.sqlite3
  qa_state_db: data/state/visual_qa.sqlite3
  translation_cache_db: data/state/query_translation.sqlite3
  scratch_limit_gib: 12
  free_space_reserve_gib: 30
  thumbnail_max_dim: 512
  thumbnail_format: webp

ingestion:
  stable_archive_seconds: 120
  worker_profiles:
    laptop:
      cpu_workers: 2
      queue_size: 4
      archive_materializers: 1
    accelerated:
      cpu_workers: 8
      queue_size: 8
      archive_materializers: 2
  scene_threshold: 0.30
  scene_threshold_grid: [0.25, 0.30, 0.35, 0.40]
  max_gap_seconds: 2
  max_gap_grid_seconds: [2, 3, 4]
  min_separation_seconds: 0.5
  calibration_min_coverage: 0.95
  calibration_tolerance_ms: 1000
  # Optional atomic report produced by scripts/calibrate_extraction.py.
  calibration_record: outputs/calibration/extraction-selection.json
  visual_queue_size: 64
  index_batch_size: 256
  projection_sample_videos: 10
  core_projection_stages: [probe, frames, visual]
  # May be set per competition via GET /v1/ingest/status query parameter.
  preload_window_seconds: null
  preload_deadline_fraction: 0.80
  stages: [probe, frames, visual, activate, ocr, asr, text]

models:
  query_translation:
    enabled: true
    model_name: Helsinki-NLP/opus-mt-vi-en
    revision: c8d2853e77f5fae31124d993e0b35176b1c8914e
    source_path: models/huggingface/opus-mt-vi-en
    converted_path: models/translation/opus-mt-vi-en-ct2-int8-c8d2853e
    tokenizer_path: models/huggingface/opus-mt-vi-en
    asset_manifest: checksums/query-translation.sha256
    device: cpu
    compute_type: int8
    intra_threads: 8
    max_decoding_length: 128
    memory_cache_entries: 2048
    disk_cache_entries: 10000
    allow_transformers_fallback: true
    local_files_only: true
  visual:
    backend: siglip2
    model_name: google/siglip2-base-patch16-224
    revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
    embedding_dim: 768
    device: cuda
    dtype: float16
    batch_size: 8
    max_batch_size: 32
    cache_dir: models/huggingface
    local_files_only: true
  organizer_clip:
    enabled: true
    model_name: ViT-B-32-quickgelu
    pretrained: openai
    embedding_dim: 512
    # Organizer search is intentionally CPU-only on the laptop profile so it
    # cannot contend with SigLIP2/raw refinement for the 4 GiB GPU.
    query_device: cpu
    verification_device: cuda
    verification_record: data/state/organizer-clip-verification.json
    verification_sample_size: 16
    verification_median_cosine: 0.999
    cache_dir: models/open_clip
    local_files_only: true
  organizer_compatible_visual:
    enabled: true
    enabled_profiles: [accelerated]
    model_name: ViT-B-32-quickgelu
    pretrained: openai
    embedding_dim: 512
    device: cuda
    batch_size: 8
    verification_record: data/state/organizer-clip-verification.json
    verification_median_cosine: 0.999
    cache_dir: models/open_clip
    local_files_only: true
  accelerated_visual:
    enabled: true
    enabled_profiles: [accelerated]
    model_name: ViT-L-14-quickgelu
    pretrained: dfn2b
    embedding_dim: 768
    device: cuda
    batch_size: 8
    cache_dir: models/open_clip
    local_files_only: true
  text:
    model_name: dangvantuan/vietnamese-embedding
    revision: 4ab46e46ba5902328ba0742e489e75f787932f2b
    embedding_dim: 768
    device: cpu
    batch_size: 16
    cache_dir: models/huggingface
    local_files_only: true
  florence2:
    # Experimental and operator-selected only; construction is lazy/offline.
    # Missing assets produce a structured not-provisioned error.
    enabled: true
    model_name: microsoft/Florence-2-base
    revision: 5ca5edf5bd017b9919c05d08aebef5e4c7ac3bac
    model_path: models/huggingface/florence-2-base
    weights_sha256: 03075d2d2d2bbd3e180b9ba0afae4aa8563226e2d32911656966e05b2f2ee060
    device: cpu
    max_new_tokens: 256
    local_files_only: true
  ocr:
    engine: paddleocr
    recognition_model: latin_PP-OCRv5_mobile_rec
    detection_model: PP-OCRv5_mobile_det
    cache_dir: models/paddleocr
    local_files_only: true
    languages: [vi, en]
    use_gpu: false
  whisper:
    model_size: large-v3-turbo
    hub_model_id: dropbox-dash/faster-whisper-large-v3-turbo
    revision: 0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf
    local_path: models/whisper/large-v3-turbo
    language: vi
    device: cuda
    compute_type: int8_float16
    batch_size: 1
    beam_size: 1
    retry_beam_size: 5
    vad_filter: true
    cache_dir: models/whisper
    local_files_only: true
    extract_audio_16khz: true
services:
  gemini_vlm:
    api_key_env: GEMINI_API_KEY
    model: gemini-3.6-flash
    timeout_seconds: 5
    max_images: 1
    max_concurrency: 1
  ollama_vlm:
    url: http://127.0.0.1:11434
    url_env: OLLAMA_URL
    model: qwen2.5vl:3b-q4_K_M
    expected_digest_prefix: fb90415cde1e
    connect_timeout_seconds: 2
    timeout_seconds: 60
    keep_alive: 15m
    num_ctx: 4096
    max_new_tokens: 64
    max_images: 1
    max_concurrency: 1
  qdrant:
    url: http://127.0.0.1:6333
    url_env: QDRANT_URL
    api_key_env: QDRANT_API_KEY
    grpc_port: 6334
    prefer_grpc: true
    collections:
      native_frames: aic_native_{batch}_siglip2_b16_224_r75de2d55_768d_v1
      organizer_frames: aic25_b1_openclip_b32_quickgelu_openai_512d_v1
      organizer_compatible_frames: aic_native_{batch}_openclip_b32_quickgelu_openai_512d_v1
      accelerated_frames: aic_native_{batch}_openclip_l14_quickgelu_dfn2b_fp5cac988a_768d_v1
      text_segments: aic_text_{batch}_vietnamese_embedding_r4ab46e46_meanpool_normalized_768d_v1
    distance: Cosine
  meilisearch:
    url: http://127.0.0.1:7700
    url_env: MEILISEARCH_URL
    api_key_env: MEILISEARCH_MASTER_KEY
    indexes:
      ocr: aic_ocr_v1
      asr: aic_asr_v1
      metadata: aic_metadata_v1
    shadow_indexes:
      ocr: aic_ocr_vi_v2
      asr: aic_asr_vi_v2
      metadata: aic_metadata_multilingual_v2

retrieval:
  top_k: 100
  rrf_k: 60
  text_query:
    max_chunks: 4
    overlap_tokens: 8
    language_default: auto
  candidate_depths:
    visual: 300
    organizer_clip: 300
    accelerated_visual: 300
    ocr: 200
    asr: 200
    semantic_text: 200
    metadata: 100
  channel_weights:
    visual: 1.0
    organizer_clip: 0.8
    accelerated_visual: 0.9
    ocr: 0.8
    asr: 0.7
    semantic_text: 0.7
    metadata: 0.4
  tune_rrf_k: [20, 40, 60, 80]
  # A labeled report at this path overrides only k/depths/weights; a no-label
  # defaults report is intentionally ignored by the runtime.
  tuning_record: outputs/evaluation/retrieval-tuning.json
  temporal_windows_ms: [4000, 8000]
  raw_refinement:
    enabled: true
    top_windows: 20
    radius_seconds: 4
    fps: 6
    persistence_max_entries: 20000
    persistence_max_bytes: 2147483648
    persistence_max_image_bytes: 2097152
    webp_quality: 85
  diversity:
    min_separation_ms: 3000
    early_cutoff: 20
    early_per_video: 2
    late_per_video: 5
  rocchio:
    alpha: 1.0
    beta: 0.75
    gamma: 0.25
  trake:
    top_k: 100
    candidate_depth: 300
    max_candidate_videos: 200
    # Positive query gates only; failed readiness probes are never cached.
    readiness_cache_seconds: 300
    seed_frames_per_prompt: 4
    grouped_search_workers: 8
    vector_scroll_batch_size: 4096
    persist_trajectory_cache: true
    trajectory_snapshot_schema_version: 1
    trajectory_snapshot_lock_timeout_seconds: 600
    global_weight: 0.25
    min_stages: 2
    max_stages: 20
    raw_refinement_enabled: false
  visual_qa:
    candidate_cards: 5
    initial_clusters: 1
    expansion_step: 5
    automatic_targets: [5, 10, 15, 20]
    max_clusters: 20
    candidate_pool: 100
    window_radius_ms: 4000
    frames_per_window: 3
    min_frames_per_window: 3
    min_cluster_separation_ms: 3000
    session_ttl_seconds: 86400
    reasoning_cache_ttl_seconds: 2592000
    image_max_source_bytes: 16777216
    image_max_request_bytes: 20971520
    image_max_dimension: 768
    cuda_cache_clear_threshold: 0.80
    default_answer_spec_id: aic-2026-visual-qa-general-text-provisional-v1

competition:
  spec_id: aic-2025-textual-kis
  output_columns: [video_name, frame_idx]
  max_results: 100
  cutoffs: [1, 5, 20, 50, 100]
  include_header: false
  output_dir: outputs/submissions

api:
  host: 127.0.0.1
  port: 8080

logging:
  level: INFO
  log_file: logs/aic2026.log
  app_error_file: outputs/logs/app_error.log
  rotation: 10 MB
