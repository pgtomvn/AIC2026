# AIC 2026 Textual KIS, Visual Q&A, and TRAKE defaults. Paths are project-relative and generated
# state remains outside Git.  The laptop profile is the guaranteed baseline.

profile: laptop

runtime:
  default_batch_id: aic25-b1-reference

warmup:
  enabled: true
  include_raw_refiner: true
  warm_query: một người đang đi bộ trong thành phố
  startup_budget_seconds: 90
  retry_after_seconds: 2

readiness:
  cache_seconds: 10
  cloud_import_completion_receipt: data/checkpoints/cloud-import/b01-import-complete.json
  accelerated_min_usable_vram_gib: 11.5
  default_batch_kind: native
  batches:
    aic25-b1-reference:
      kind: reference
      # Organizer maps/vectors retain every JPEG ordinal.  Adjacent ordinals
      # share a submitted source frame in 614 cases, so canonical media uses
      # the distinct source-frame identity count instead of the row count.
      expected_mapping_rows: 177321
      expected_canonical_frames: 176707
      canonical_image_min_coverage: 0.99
      expected_videos: 873
      workflows:
        kis: [organizer_clip, metadata]
        qa: [organizer_clip, metadata, canonical_images]
        trake: [organizer_clip]
      channels:
        organizer_clip: required
        metadata: required
        canonical_images: required
        ollama_vlm: required
        gemini_vlm: optional
        visual: optional
        semantic_text: optional
        ocr: optional
        asr: optional
        accelerated_visual: optional
    aic26-b2:
      kind: reference
      retrieval_enabled: true
      expected_mapping_rows: 220270
      # B02 uses ordinal identity; relative N frame_idx and nine M08 pairs
      # must never be silently collapsed by source-frame identity.
      expected_canonical_frames: 220270
      expected_videos: 614
      canonical_image_min_coverage: 0.99
      # Eligible M/S only; N and M08_V001 are excluded by the TRAKE scope.
      trake_enabled: true
      workflows:
        kis: [organizer_clip]
        qa: [organizer_clip, canonical_images]
        trake: [organizer_clip]
      channels:
        organizer_clip: required
        canonical_images: required
        ollama_vlm: required
        gemini_vlm: optional
        visual: optional
        semantic_text: optional
        metadata: optional
        ocr: optional
        asr: optional
        accelerated_visual: optional
  native_defaults:
    workflows:
      kis: [visual]
      qa: [visual, canonical_images]
      trake: [visual]
    channels:
      visual: required
      canonical_images: required
      ollama_vlm: required
      gemini_vlm: optional
      metadata: optional
      semantic_text: optional
      ocr: optional
      asr: optional
      organizer_clip: not_applicable
      accelerated_visual: optional

tools:
  ffmpeg:
    # Created by scripts/install_ffmpeg.py from a user-supplied, checksum-pinned ZIP.
    manifest: .tools/ffmpeg/active.json

data:
  root: data
  archives: data/archives
  raw_videos: data/raw/videos
  raw_keyframes: data/keyframes/native
  embeddings: data/embeddings
  metadata: data/metadata
  ocr: data/ocr
  asr: data/asr
  scratch: data/cache/scratch
  refined_frames: data/cache/refined-frames
  trake_trajectory_cache: data/cache/trake-trajectories
  catalog_db: data/state/jobs.sqlite3
  artifact_db: data/state/artifacts.sqlite3
  qa_state_db: data/state/visual_qa.sqlite3
  translation_cache_db: data/state/query_translation.sqlite3
  scratch_limit_gib: 12
  free_space_reserve_gib: 30
  thumbnail_max_dim: 512
  thumbnail_format: webp

ingestion:
  stable_archive_seconds: 120
  worker_profiles:
    laptop:
      cpu_workers: 2
      queue_size: 4
      archive_materializers: 1
    accelerated:
      cpu_workers: 8
      queue_size: 8
      archive_materializers: 2
  scene_threshold: 0.30
  scene_threshold_grid: [0.25, 0.30, 0.35, 0.40]
  max_gap_seconds: 2
  max_gap_grid_seconds: [2, 3, 4]
  min_separation_seconds: 0.5
  calibration_min_coverage: 0.95
  calibration_tolerance_ms: 1000
  # Optional atomic report produced by scripts/calibrate_extraction.py.
  calibration_record: outputs/calibration/extraction-selection.json
  visual_queue_size: 64
  index_batch_size: 256
  projection_sample_videos: 10
  core_projection_stages: [probe, frames, visual]
  # May be set per competition via GET /v1/ingest/status query parameter.
  preload_window_seconds: null
  preload_deadline_fraction: 0.80
  stages: [probe, frames, visual, activate, ocr, asr, text]

models:
  query_translation:
    enabled: true
    model_name: Helsinki-NLP/opus-mt-vi-en
    revision: c8d2853e77f5fae31124d993e0b35176b1c8914e
    source_path: models/huggingface/opus-mt-vi-en
    converted_path: models/translation/opus-mt-vi-en-ct2-int8-c8d2853e
    tokenizer_path: models/huggingface/opus-mt-vi-en
    asset_manifest: checksums/query-translation.sha256
    device: cpu
    compute_type: int8
    intra_threads: 8
    request_timeout_seconds: 3
    startup_timeout_seconds: 30
    sentence_max_chars: 400
    source_token_limit: 448
    max_decoding_length: 128
    memory_cache_entries: 2048
    disk_cache_entries: 10000
    allow_transformers_fallback: true
    local_files_only: true
  visual:
    backend: siglip2
    model_name: google/siglip2-base-patch16-224
    revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
    embedding_dim: 768
    device: cuda
    dtype: float16
    batch_size: 8
    max_batch_size: 32
    cache_dir: models/huggingface
    local_files_only: true
  organizer_clip:
    enabled: true
    model_name: ViT-B-32-quickgelu
    pretrained: openai
    embedding_dim: 512
    # Organizer search is intentionally CPU-only on the laptop profile so it
    # cannot contend with SigLIP2/raw refinement for the 4 GiB GPU.
    query_device: cpu
    verification_device: cuda
    verification_record: data/state/organizer-clip-verification.json
    verification_sample_size: 16
    verification_median_cosine: 0.999
    batch_verifications:
      aic26-b2:
        record: outputs/checkpoints/b02-p1/b02-clip-encoder-verification.json
        manifest_sha256: e9bc8ec6daa64380228851b7e5dab854b122539a63ec1ba1e91aef5ee798079c
        feature_archive_sha256: ce1c487d0d83d976628716822b869819d8e0f77ae4be176207db9341b5e53b14
        sample_count: 6
        minimum_median_cosine: 0.999
        minimum_sample_cosine: 0.999
    cache_dir: models/open_clip
    local_files_only: true
  organizer_compatible_visual:
    enabled: true
    enabled_profiles: [accelerated]
    model_name: ViT-B-32-quickgelu
    pretrained: openai
    embedding_dim: 512
    device: cuda
    batch_size: 8
    verification_record: data/state/organizer-clip-verification.json
    verification_median_cosine: 0.999
    cache_dir: models/open_clip
    local_files_only: true
  accelerated_visual:
    enabled: true
    enabled_profiles: [accelerated]
    model_name: ViT-L-14-quickgelu
    pretrained: dfn2b
    embedding_dim: 768
    device: cuda
    batch_size: 8
    cache_dir: models/open_clip
    local_files_only: true
  text:
    model_name: dangvantuan/vietnamese-embedding
    revision: 4ab46e46ba5902328ba0742e489e75f787932f2b
    embedding_dim: 768
    device: cpu
    batch_size: 16
    cache_dir: models/huggingface
    local_files_only: true
  florence2:
    # Experimental and operator-selected only; construction is lazy/offline.
    # Missing assets produce a structured not-provisioned error.
    enabled: true
    model_name: microsoft/Florence-2-base
    revision: 5ca5edf5bd017b9919c05d08aebef5e4c7ac3bac
    model_path: models/huggingface/florence-2-base
    weights_sha256: 03075d2d2d2bbd3e180b9ba0afae4aa8563226e2d32911656966e05b2f2ee060
    device: cpu
    max_new_tokens: 256
    timeout_seconds: 90
    local_files_only: true
  ocr:
    engine: paddleocr
    recognition_model: latin_PP-OCRv5_mobile_rec
    detection_model: PP-OCRv5_mobile_det
    cache_dir: models/paddleocr
    local_files_only: true
    languages: [vi, en]
    use_gpu: false
  whisper:
    profile: production
    model_size: large-v3-turbo
    hub_model_id: dropbox-dash/faster-whisper-large-v3-turbo
    revision: 0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf
    local_path: models/whisper/large-v3-turbo
    asset_manifest: checksums/whisper-large-v3-turbo.sha256
    language: vi
    device: cuda
    compute_type: int8_float16
    batch_size: 1
    beam_size: 1
    retry_beam_size: 5
    vad_filter: true
    vad_parameters:
      min_silence_duration_ms: 500
      speech_pad_ms: 200
    condition_on_previous_text: true
    cache_dir: models/whisper
    local_files_only: true
    extract_audio_16khz: true
  reference_provisioning:
    rapidocr:
      package_version: 3.9.2
      engine: onnxruntime
      ocr_version: PP-OCRv6
      model_type: small
      language: vi
      model_dir: models/rapidocr/ppocrv6-small-multilingual
      source_repo: DjB314/RapidOCR
      source_revision: 04e88d0483f0bfcdd0f29429594244c10bfc2867
      asset_manifest: checksums/rapidocr-reference.sha256
      confidence_threshold: 0.50
      min_text_characters: 2
      local_files_only: true
    whisper:
      model_size: small
      hub_model_id: Systran/faster-whisper-small
      revision: 536b0662742c02347bc0e980a01041f333bce120
      local_path: models/whisper/small
      asset_manifest: checksums/whisper-small.sha256
      language: vi
      device: cpu
      compute_type: int8
      beam_size: 1
      retry_beam_size: 1
      vad_filter: true
      local_files_only: true
    resource_limits:
      process_rss_gib: 3.5
      gpu_process_gib: 2.5
      sample_interval_seconds: 0.25
    ocr_upsert_batch_size: 500
    vector_upsert_batch_size: 256
    siglip_initial_batch_size: 8
    siglip_max_batch_size: 16
services:
  gemini_vlm:
    api_key_env: GEMINI_API_KEY
    model: gemini-3.6-flash
    timeout_seconds: 5
    max_images: 1
    max_concurrency: 1
  ollama_vlm:
    url: http://127.0.0.1:11434
    url_env: OLLAMA_URL
    model: qwen2.5vl:3b-q4_K_M
    execution_mode: auto
    execution_mode_env: AIC_QA_DEVICE
    expected_digest_prefix: fb90415cde1e
    connect_timeout_seconds: 2
    timeout_seconds: 60
    keep_alive: 15m
    num_ctx: 4096
    max_new_tokens: 64
    max_images: 1
    max_concurrency: 1
  qdrant:
    url: http://127.0.0.1:6333
    url_env: QDRANT_URL
    api_key_env: QDRANT_API_KEY
    grpc_port: 6334
    prefer_grpc: true
    collections:
      native_frames: aic_native_{batch}_siglip2_b16_224_r75de2d55_768d_v1
      organizer_frames: aic25_b1_openclip_b32_quickgelu_openai_512d_v1
      organizer_compatible_frames: aic_native_{batch}_openclip_b32_quickgelu_openai_512d_v1
      accelerated_frames: aic_native_{batch}_openclip_l14_quickgelu_dfn2b_fp5cac988a_768d_v1
      text_segments: aic_text_{batch}_vietnamese_embedding_r4ab46e46_meanpool_normalized_768d_v1
    distance: Cosine
  meilisearch:
    url: http://127.0.0.1:7700
    url_env: MEILISEARCH_URL
    api_key_env: MEILISEARCH_MASTER_KEY
    indexes:
      ocr: aic_ocr_v1
      asr: aic_asr_v1
      metadata: aic_metadata_v1
    shadow_indexes:
      ocr: aic_ocr_vi_v2
      asr: aic_asr_vi_v2
      metadata: aic_metadata_multilingual_v2

retrieval:
  all_batches:
    # Rollback changes only this flag; neither corpus nor index is modified.
    enabled: true
  interactive:
    # Production tools are explicit user actions; no unvalidated automatic rank changes.
    schema_version: 1
    feedback_enabled: true
    conversation_enabled: true
    temporal_enabled: true
    evidence_enabled: true
    automatic_activation: false
    temporal_release_record: outputs/evaluation/temporal-english-local-release.json
    event_inspection_enabled: false  # local inference smoke failed; keep isolated until verified
  # Canonical metadata only; scalar restores the per-hit lookup implementation.
  metadata_resolution: asr_only_batched
  top_k: 100
  rrf_k: 60
  semantic_views:
    # Late fusion stays global-only until a locked-qrels record passes activation.
    fusion: global_only
    weights: {}
    consensus_alpha: 0.0
    tuning_record: outputs/evaluation/kis-semantic-view-tuning.json
  candidate_rescue:
    # Shadow executes and diagnoses rescue, but never changes returned ranks.
    mode: shadow
    sample_size: 50
    min_unique_videos: 15
    max_top_video_share: 0.25
    max_video_hhi: 0.12
    expanded_depth: 600
    max_depth: 900
    grouped_videos: 100
    frames_per_video: 2
    overfetch_weight: 0.4
    grouped_weight: 0.8
    tuning_record: outputs/evaluation/kis-candidate-rescue-tuning.json
  video_local:
    # Uses the already-warmed TRAKE cache; request handling never warms it.
    # Kept available for research, but disabled at runtime because the combined
    # three-feature shadow benchmark exceeded the 1.2x warm-p95 gate.
    mode: "off"
    source_channel: organizer_clip
    candidate_videos: 12
    frames_per_video: 5
    weight: 0.6
    support_window_ms: 8000
    gaussian_sigma_ms: 4000
    tuning_record: outputs/evaluation/kis-video-local-tuning.json
  ocr_quality:
    mode: shadow
    sidecar_path: data/state/ocr-quality.sqlite3
    min_multiplier: 0.65
    max_multiplier: 1.10
    candidate_limit: 200
    tuning_record: outputs/evaluation/kis-ocr-quality-tuning.json
  text_reranker:
    # Model loading stays outside the default CPU/offline environment.
    mode: "off"
    model_name: BAAI/bge-reranker-v2-m3
    candidate_limit: 50
    eligible_channels: [ocr, asr, metadata]
    tuning_record: outputs/evaluation/kis-text-reranker-tuning.json
  interaction_log:
    mode: shadow
    path: outputs/evaluation/kis-interactions.jsonl
    max_results: 100
  intent_policies:
    visual_dense: {rrf_k: 60, dense_share: 0.70, text_share: 0.30}
    lexical_dominant: {rrf_k: 40, dense_share: 0.25, text_share: 0.75}
    spatial_color: {rrf_k: 60, dense_share: 0.70, text_share: 0.30}
  entity_routing:
    extractor_version: vi-entity-rules-v1
    lexical_multiplier: 3.0
    bonus_alpha: 0.25
    required_scope: video_all_lexical
    max_entities_per_prompt: 16
    max_entities_per_trake_query: 64
  text_query:
    max_chunks: 4
    overlap_tokens: 8
    language_default: auto
  candidate_depths:
    visual: 300
    organizer_clip: 300
    accelerated_visual: 300
    ocr: 200
    asr: 200
    semantic_text: 200
    metadata: 100
  channel_weights:
    visual: 1.0
    organizer_clip: 0.8
    accelerated_visual: 0.9
    ocr: 0.8
    asr: 0.7
    semantic_text: 0.7
    metadata: 0.4
  asr_routing:
    enabled: true
    max_weight: 0.7
    temporal_overlap_bonus: 0.3
    temporal_padding_ms: 1000
    qa_context_radius_ms: 30000
    qa_context_max_characters: 4000
  tune_rrf_k: [20, 40, 60, 80]
  # A labeled report at this path overrides only k/depths/weights; a no-label
  # defaults report is intentionally ignored by the runtime.
  tuning_record: outputs/evaluation/retrieval-tuning.json
  intent_tuning_record: outputs/evaluation/retrieval-intent-tuning.json
  advanced_kis:
    enabled: true
    object_batch_id: aic25-b1-reference
    object_archive: objects-aic25-b1.zip
    object_confidence_threshold: 0.50
    object_max_member_bytes: 1048576
    object_cache_entries: 2048
    object_cache_bytes: 16777216
    # Largest measured head with transactional warm p95 <= 20 ms (2026-08-24).
    spatial_candidate_depth: 64
    # Cooperative verification budget after separately timed evidence prefetch.
    # Engineering limit for the laptop; not selected using test-set accuracy.
    verification_budget_ms: 20
    spatial_beta: 0.35
    color_candidate_depth: 8
    color_absent_multiplier: 0.65
    color_image_dimension: 224
    color_workers: 2
    color_cache_entries: 512
    color_cache_bytes: 16777216
    relation_beta: 0.40
    spatial_ontology:
      directional_margin: 0.03
      directional_scale: 0.25
      near_threshold: 0.35
      far_min: 0.30
      far_max: 0.70
      inside_satisfied_coverage: 0.90
      between_projection_min: 0.10
      between_projection_max: 0.90
      between_perpendicular_threshold: 0.20
      depth_area_ratio: 1.20
      depth_sigmoid_scale: 10.0
      depth_vertical_tolerance: 0.05
      perspective_weight: 0.50
      nms_iou_threshold: 0.50
      max_detections_per_node: 6
      beam_width: 512
    negation_confidence_threshold: 0.60
    negation_multiplier: 0.10
    strict_color_roi_threshold: 0.12
    strict_color_beta: 0.25
    strict_color_mismatch_multiplier: 0.10
    cross_modal:
      enabled: false
      allowed_profiles: [accelerated]
      candidate_depth: 20
      max_object_crops: 2
      calibration: rank
      seed_weights:
        base: 0.60
        global: 0.25
        crop: 0.15
      tuning_record: outputs/evaluation/kis-cross-modal-tuning.json
  temporal_windows_ms: [4000, 8000]
  raw_refinement:
    enabled: true
    top_windows: 20
    radius_seconds: 4
    fps: 6
    persistence_max_entries: 20000
    persistence_max_bytes: 2147483648
    persistence_max_image_bytes: 2097152
    webp_quality: 85
  diversity:
    min_separation_ms: 3000
    early_cutoff: 20
    early_per_video: 2
    late_per_video: 5
  rocchio:
    alpha: 1.0
    beta: 0.75
    gamma: 0.25
  trake:
    top_k: 100
    candidate_depth: 300
    max_candidate_videos: 200
    # Positive query gates only; failed readiness probes are never cached.
    readiness_cache_seconds: 300
    seed_frames_per_prompt: 4
    grouped_search_workers: 8
    vector_scroll_batch_size: 4096
    persist_trajectory_cache: true
    trajectory_snapshot_schema_version: 2
    trajectory_snapshot_lock_timeout_seconds: 600
    global_weight: 0.25
    # Penalize only the excess beyond two minutes; 0.001 costs 0.06 per
    # additional minute. Shot cost applies only when trustworthy shot IDs exist.
    max_stage_gap_ms: 120000
    temporal_gap_penalty_per_second: 0.001
    shot_boundary_penalty: 0.02
    min_stages: 2
    max_stages: 20
    raw_refinement_enabled: false
  visual_qa:
    candidate_cards: 5
    initial_clusters: 1
    expansion_step: 5
    automatic_targets: [5, 10, 15, 20]
    max_clusters: 20
    candidate_pool: 100
    window_radius_ms: 4000
    frames_per_window: 3
    min_frames_per_window: 3
    min_cluster_separation_ms: 3000
    session_ttl_seconds: 86400
    reasoning_cache_ttl_seconds: 2592000
    image_max_source_bytes: 16777216
    image_max_request_bytes: 20971520
    image_max_dimension: 768
    cuda_cache_clear_threshold: 0.80
    default_answer_spec_id: aic-2026-visual-qa-general-text-provisional-v1

competition:
  spec_id: aic-2025-textual-kis
  output_columns: [video_name, frame_idx]
  max_results: 100
  cutoffs: [1, 5, 20, 50, 100]
  include_header: false
  output_dir: outputs/submissions

api:
  host: 127.0.0.1
  port: 8080

logging:
  level: INFO
  log_file: logs/aic2026.log
  app_error_file: outputs/logs/app_error.log
  rotation: 10 MB
